[project]
name = "astrbot-plugin-rss"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = ["aiosqlite>=0.20", "curl_cffi>=0.16.3,<0.17", "emoji>=2.14,<3", "feedparser>=6.0", "markdown-it-py>=3,<5", "markdownify>=1.2,<2", "Pillow>=10.0", "tzdata>=2024.1"]

[project.optional-dependencies]
browser = ["cloakbrowser>=0.6.2,<0.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
